name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build web assets
        run: |
          npm install
          npm run build
      - name: Generate Capacitor Android project and apply native code
        run: |
          cp -R android /tmp/native-template
          rm -rf android
          npx cap add android
          cp /tmp/native-template/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/native-template/app/src/main/res/values/styles.xml android/app/src/main/res/values/styles.xml
          mkdir -p android/app/src/main/java/com/phantomx/launcher
          cp /tmp/native-template/app/src/main/java/com/phantomx/launcher/*.java android/app/src/main/java/com/phantomx/launcher/
          npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PHANTOM-X-Launcher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: phantom-x-launcher-apk
          path: PHANTOM-X-Launcher.apk
      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PHANTOM-X-Launcher.apk
